name: planejamento_financeiro
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  package_info_plus: ^8.3.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  form_builder_validators: ^11.2.0
  flutter_form_builder: ^10.1.0
  currency_text_input_formatter: ^2.3.0
  dio: ^5.8.0+1
  auto_injector: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/work_sans/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/work_sans/WorkSans-SemiBold.ttf
          weight: 600
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
