name: planejamento_financeiro
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  package_info_plus: ^10.2.2
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  form_builder_validators: ^11.3.0
  flutter_form_builder: ^11.0.0
  currency_text_input_formatter: ^2.3.3
  dio: ^5.11.1
  auto_injector: ^2.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/work_sans/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/work_sans/WorkSans-SemiBold.ttf
          weight: 600
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
