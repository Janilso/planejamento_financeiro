name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test
